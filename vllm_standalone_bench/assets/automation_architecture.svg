<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" role="img" aria-labelledby="title desc">
  <title id="title">vLLM Standalone Bench 自动化测试工程架构</title>
  <desc id="desc">从配置、控制器、Docker 或 SSH 执行面，到 benchmark runner、被测服务、监控和结果产物的端到端架构图。</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    .title { fill: #1a1a1a; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #666666; font-size: 14px; }
    .group-title { fill: #333333; font-size: 15px; font-weight: 700; }
    .card-title { fill: #1a1a1a; font-size: 14px; font-weight: 700; }
    .body { fill: #333333; font-size: 12px; }
    .muted { fill: #666666; font-size: 11px; }
    .note { fill: #999999; font-size: 11px; }
  </style>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a4a4a"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d9d78"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e67e22"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">vLLM Standalone Bench 自动化测试工程架构</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">配置驱动的离线压测控制器：编排服务启动、ready check、矩阵压测、资源监控、结果落盘、恢复与清理</text>

  <!-- 输入与入口 -->
  <rect x="42" y="100" width="302" height="210" rx="10" fill="#fbfdfc" stroke="#b8d4c3" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="68" y="120" width="250" height="30" rx="8" fill="#5b8c6f"/>
  <text x="193" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">入口层 · 配置与操作</text>
  <rect x="72" y="170" width="102" height="48" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="123" y="191" text-anchor="middle" class="card-title">操作者</text>
  <text x="123" y="209" text-anchor="middle" class="muted">run/status/logs</text>
  <rect x="194" y="166" width="106" height="58" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="247" y="187" text-anchor="middle" class="card-title">JSON 配置</text>
  <text x="247" y="205" text-anchor="middle" class="muted">run/models</text>
  <text x="247" y="220" text-anchor="middle" class="muted">serve/bench/topology</text>
  <rect x="72" y="244" width="228" height="42" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="186" y="264" text-anchor="middle" class="body">辅助脚本：run_auto_bench.sh</text>
  <text x="186" y="280" text-anchor="middle" class="muted">封装默认配置、后台控制、Mooncake 本地辅助</text>

  <!-- 控制器 -->
  <rect x="392" y="96" width="456" height="238" rx="10" fill="#fcfcfc" stroke="#d4ccb8" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="420" y="116" width="400" height="30" rx="8" fill="#8a7a5e"/>
  <text x="620" y="136" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">控制层 · auto_bench.py</text>
  <rect x="420" y="166" width="188" height="124" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="514" y="188" text-anchor="middle" class="card-title">配置解析与校验</text>
  <text x="436" y="211" class="body"><tspan font-weight="700">Run:</tspan> 镜像、网络、结果目录</text>
  <text x="436" y="230" class="body"><tspan font-weight="700">Model:</tspan> 宿主机路径映射</text>
  <text x="436" y="249" class="body"><tspan font-weight="700">Profile:</tspan> serve / topology / bench</text>
  <text x="436" y="268" class="body"><tspan font-weight="700">Case:</tspan> 展开矩阵并分组</text>
  <rect x="632" y="166" width="188" height="124" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="726" y="188" text-anchor="middle" class="card-title">运行状态机</text>
  <text x="648" y="211" class="body"><tspan font-weight="700">Lock:</tspan> 防止同 run_id 并发</text>
  <text x="648" y="230" class="body"><tspan font-weight="700">Manifest:</tspan> 记录 case 状态</text>
  <text x="648" y="249" class="body"><tspan font-weight="700">Resume:</tspan> 跳过 passed case</text>
  <text x="648" y="268" class="body"><tspan font-weight="700">Cleanup:</tspan> 标签归属保护</text>
  <text x="620" y="316" text-anchor="middle" class="note">核心原则：只清理本次运行拥有的容器和网络，敏感信息写入前会脱敏或私有化保存。</text>

  <!-- 执行面 -->
  <rect x="896" y="100" width="462" height="210" rx="10" fill="#fbfcfe" stroke="#b8c8d8" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="928" y="120" width="398" height="30" rx="8" fill="#5a7290"/>
  <text x="1127" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">执行面 · Docker / SSH Docker</text>
  <rect x="930" y="168" width="180" height="102" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="1020" y="190" text-anchor="middle" class="card-title">本地 Docker 模式</text>
  <text x="946" y="214" class="body">单容器启动 vLLM/SGLang</text>
  <text x="946" y="233" class="body">bridge network 隔离</text>
  <text x="946" y="252" class="body">ready probe 容器探活</text>
  <rect x="1132" y="168" width="180" height="102" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="1222" y="190" text-anchor="middle" class="card-title">远程 Topology 模式</text>
  <text x="1148" y="214" class="body">SSH 执行远端 docker</text>
  <text x="1148" y="233" class="body">prefill / decode / router</text>
  <text x="1148" y="252" class="body">支持 SGLang HiCache、vLLM PD</text>

  <!-- 压测流水线 -->
  <rect x="78" y="382" width="604" height="270" rx="10" fill="#ffffff" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="108" y="402" width="544" height="30" rx="8" fill="#6a6a6a"/>
  <text x="380" y="422" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">压测流水线 · 启动服务到执行 benchmark</text>
  <rect x="114" y="462" width="142" height="68" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="185" y="486" text-anchor="middle" class="card-title">启动服务</text>
  <text x="185" y="507" text-anchor="middle" class="muted">serve / topology group</text>
  <rect x="300" y="462" width="142" height="68" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="371" y="486" text-anchor="middle" class="card-title">Ready Check</text>
  <text x="371" y="507" text-anchor="middle" class="muted">/v1/models 或远程 URL</text>
  <rect x="486" y="462" width="142" height="68" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="557" y="486" text-anchor="middle" class="card-title">Bench Runner</text>
  <text x="557" y="507" text-anchor="middle" class="muted">run_bench_multi.py</text>
  <rect x="176" y="570" width="170" height="52" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="261" y="592" text-anchor="middle" class="body">数据集与请求生成</text>
  <text x="261" y="610" text-anchor="middle" class="muted">random / chat / ASR / MTP</text>
  <rect x="414" y="570" width="170" height="52" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="499" y="592" text-anchor="middle" class="body">资源监控</text>
  <text x="499" y="610" text-anchor="middle" class="muted">CPU / Memory / IO / GPU</text>

  <!-- 被测服务 -->
  <rect x="742" y="382" width="578" height="270" rx="10" fill="#fbfcfe" stroke="#b8c8d8" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="772" y="402" width="518" height="30" rx="8" fill="#5a7290"/>
  <text x="1031" y="422" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">被测服务层 · 推理引擎与 OpenAI 兼容端点</text>
  <rect x="784" y="462" width="166" height="76" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="867" y="486" text-anchor="middle" class="card-title">vLLM / SGLang</text>
  <text x="867" y="507" text-anchor="middle" class="muted">OpenAI chat / completions</text>
  <text x="867" y="523" text-anchor="middle" class="muted">audio transcription</text>
  <rect x="988" y="462" width="166" height="76" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="1071" y="486" text-anchor="middle" class="card-title">PD 前端</text>
  <text x="1071" y="507" text-anchor="middle" class="muted">SGLang Router</text>
  <text x="1071" y="523" text-anchor="middle" class="muted">vLLM 内置 pd_proxy</text>
  <rect x="784" y="572" width="166" height="52" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="867" y="594" text-anchor="middle" class="body">Prometheus metrics</text>
  <text x="867" y="612" text-anchor="middle" class="muted">Spec decode / cache / runtime</text>
  <rect x="988" y="572" width="166" height="52" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="1071" y="594" text-anchor="middle" class="body">KV 传输链路</text>
  <text x="1071" y="612" text-anchor="middle" class="muted">P2P/NCCL · NIXL · HiCache</text>
  <rect x="1186" y="462" width="102" height="162" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
  <text x="1237" y="486" text-anchor="middle" class="card-title">接口</text>
  <text x="1237" y="510" text-anchor="middle" class="muted">/v1/chat</text>
  <text x="1237" y="529" text-anchor="middle" class="muted">/v1/completions</text>
  <text x="1237" y="548" text-anchor="middle" class="muted">/v1/audio</text>
  <text x="1237" y="584" text-anchor="middle" class="muted">/metrics</text>

  <!-- 结果产物 -->
  <rect x="118" y="720" width="1164" height="190" rx="10" fill="#fdfdfd" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="7,5"/>
  <rect x="148" y="740" width="1104" height="30" rx="8" fill="#6a6a6a"/>
  <text x="700" y="760" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">结果与诊断层 · results/&lt;run_id&gt;/</text>
  <rect x="164" y="794" width="206" height="82" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="267" y="818" text-anchor="middle" class="card-title">运行元数据</text>
  <text x="180" y="840" class="body">config.resolved.json</text>
  <text x="180" y="859" class="body">manifest.json / state.json</text>
  <rect x="412" y="794" width="206" height="82" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="515" y="818" text-anchor="middle" class="card-title">Case 结果</text>
  <text x="428" y="840" class="body">result.csv / result.xlsx</text>
  <text x="428" y="859" class="body">status.json / bench.log</text>
  <rect x="660" y="794" width="206" height="82" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="763" y="818" text-anchor="middle" class="card-title">诊断证据</text>
  <text x="676" y="840" class="body">docker.inspect.json</text>
  <text x="676" y="859" class="body">serve_command.txt / role commands</text>
  <rect x="908" y="794" width="206" height="82" rx="6" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.4"/>
  <text x="1011" y="818" text-anchor="middle" class="card-title">汇总与对比</text>
  <text x="924" y="840" class="body">resource_summary.json</text>
  <text x="924" y="859" class="body">compare CSV/XLSX/plots</text>

  <!-- 连接线 -->
  <path d="M 344 205 L 392 205" stroke="#4a4a4a" stroke-width="1.8" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="368" y="194" text-anchor="middle" class="muted">读取</text>
  <path d="M 848 205 L 896 205" stroke="#4a4a4a" stroke-width="1.8" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="872" y="194" text-anchor="middle" class="muted">渲染命令</text>
  <path d="M 620 334 L 620 360 L 380 360 L 380 382" stroke="#4a4a4a" stroke-width="1.8" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="504" y="351" text-anchor="middle" class="muted">按 serve/topology 分组</text>
  <path d="M 185 530 L 300 496" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 442 496 L 486 496" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M 628 496 L 784 500" stroke="#2d9d78" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="706" y="490" text-anchor="middle" class="muted">OpenAI 请求</text>
  <path d="M 950 500 L 988 500" stroke="#2d9d78" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text x="969" y="489" text-anchor="middle" class="muted">PD</text>
  <path d="M 1127 310 L 1127 382" stroke="#4a4a4a" stroke-width="1.8" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="1168" y="350" class="muted">启动容器</text>
  <path d="M 867 624 L 867 704 L 1011 704 L 1011 794" stroke="#e67e22" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="940" y="697" text-anchor="middle" class="muted">metrics / 资源摘要</text>
  <path d="M 499 622 L 499 704 L 515 704 L 515 794" stroke="#e67e22" stroke-width="1.8" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M 557 530 L 557 688 L 515 688 L 515 794" stroke="#4a4a4a" stroke-width="1.6" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="587" y="680" class="muted">落盘</text>
  <path d="M 726 290 C 710 646, 650 694, 267 794" stroke="#999999" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrow-gray)"/>
  <text x="596" y="686" class="muted">state / manifest</text>

  <!-- 图例 -->
  <g transform="translate(1080, 928)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#4a4a4a" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
    <text x="44" y="4" class="muted">控制流</text>
    <line x1="110" y1="0" x2="144" y2="0" stroke="#2d9d78" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="154" y="4" class="muted">压测请求</text>
    <line x1="230" y1="0" x2="264" y2="0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
    <text x="274" y="4" class="muted">结果/指标</text>
  </g>
</svg>
